<html><body>
<!-- Anna's Archive display=table view with an explicit header row whose
     column order differs from the legacy positional defaults. The parser must
     locate fields by header name, not by hardcoded index. -->
<table>
  <thead>
    <tr>
      <th></th>
      <th>Title</th>
      <th>Author</th>
      <th>Publisher</th>
      <th>Year</th>
      <th>Language</th>
      <th>Size</th>
      <th>File type</th>
      <th>Source</th>
      <th>Score</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><a tabindex="-1" href="/md5/0123456789abcdef"><img src="https://example.com/cover.jpg"/></a></td>
      <td>The Lord of the Rings</td>
      <td>J. R. R. Tolkien</td>
      <td>Allen &amp; Unwin</td>
      <td>1954</td>
      <td>English</td>
      <td>4.2 MB</td>
      <td>epub</td>
      <td>libgen</td>
      <td>9.1</td>
    </tr>
    <tr>
      <td><a tabindex="-1" href=""></a></td>
      <td>no md5 row</td>
      <td>nobody</td>
      <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    </tr>
  </tbody>
</table>
</body></html>
